global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: 'professor-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['professor-service:3002']

  - job_name: 'sala-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['sala-service:3003']

  - job_name: 'equipamento-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['equipamento-service:3004']

  - job_name: 'reserva-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['reserva-service:3005']

  - job_name: 'consulta-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['consulta-service:3006']
