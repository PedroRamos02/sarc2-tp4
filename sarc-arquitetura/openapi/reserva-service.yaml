# Exemplo de contrato OpenAPI 3 gerado pelo springdoc (reserva-service)
# Os demais serviços seguem o mesmo padrão em /v3/api-docs.
openapi: 3.0.3
info:
  title: SARC — reserva-service
  version: "1.0"
  description: Reservas de espaços e equipamentos, disponibilidade e agenda pública.
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
paths:
  /reservas:
    post:
      tags: [Reservas]
      summary: Criar reserva (US05, US06, US07)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaRequest' }
      responses:
        "201":
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "409":
          description: Conflito de horário (US07)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /reservas/minhas:
    get:
      tags: [Reservas]
      summary: Listar minhas reservas (US09)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Página de reservas do professor autenticado
  /reservas/{id}:
    delete:
      tags: [Reservas]
      summary: Cancelar reserva (US08)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Cancelada }
        "403": { description: Reserva pertence a outro professor }
        "404": { description: Não encontrada }
  /disponibilidade:
    get:
      tags: [Disponibilidade]
      summary: Verificar disponibilidade de um espaço (US02, US03)
      parameters:
        - { name: espacoId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: data, in: query, required: true, schema: { type: string, format: date } }
        - { name: horaInicio, in: query, required: true, schema: { type: string, example: "10:00" } }
        - { name: horaFim, in: query, required: true, schema: { type: string, example: "12:00" } }
      responses:
        "200":
          description: Situação do espaço no intervalo
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponivel: { type: boolean }
                  conflitos:
                    type: array
                    items: { $ref: '#/components/schemas/AgendaItem' }
  /agenda:
    get:
      tags: [Agenda pública]
      summary: Agenda pública de reservas (US10, US11) — sem autenticação
      security: []
      parameters:
        - { name: data, in: query, schema: { type: string, format: date } }
        - { name: professorId, in: query, schema: { type: integer, format: int64 } }
        - { name: espacoId, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Lista de aulas/reservas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgendaItem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    BadRequest:
      description: Erro de validação
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ReservaRequest:
      type: object
      required: [espacoId, data, horaInicio, horaFim]
      properties:
        espacoId: { type: integer, format: int64 }
        data: { type: string, format: date }
        horaInicio: { type: string, example: "10:00" }
        horaFim: { type: string, example: "12:00" }
        observacao: { type: string, maxLength: 255 }
        equipamentoIds:
          type: array
          items: { type: integer, format: int64 }
    ReservaResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        data: { type: string, format: date }
        horaInicio: { type: string }
        horaFim: { type: string }
        status: { type: string, enum: [CONFIRMADA, CANCELADA] }
        espaco:
          type: object
          properties:
            id: { type: integer, format: int64 }
            nome: { type: string }
            localizacao: { type: string }
        equipamentos:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              nome: { type: string }
    AgendaItem:
      type: object
      properties:
        data: { type: string, format: date }
        horaInicio: { type: string }
        horaFim: { type: string }
        espacoNome: { type: string }
        localizacao: { type: string }
        professorNome: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
